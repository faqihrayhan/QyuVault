<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 512px;
    height: 512px;
  }
  .avatar-box {
    width: 512px;
    height: 512px;
    background: radial-gradient(circle at 50% 45%, #162032 0%, #080B11 80%);
    border-radius: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(0, 240, 255, 0.2);
  }
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
    background-size: 24px 24px;
    mask-image: radial-gradient(circle at center, black 50%, transparent 85%);
  }
  svg {
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 28px rgba(0, 240, 255, 0.35));
  }
  .brand-text {
    margin-top: 14px;
    text-align: center;
    z-index: 2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .title {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #FFFFFF;
    text-transform: uppercase;
  }
  .title span {
    color: #00F0FF;
    text-shadow: 0 0 16px rgba(0, 240, 255, 0.7);
  }
</style>
</head>
<body>

<div class="avatar-box">
  <div class="grid-bg"></div>

  <!-- SVG Icon -->
  <svg width="270" height="270" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" />
        <stop offset="50%" stop-color="#3B82F6" />
        <stop offset="100%" stop-color="#8B5CF6" />
      </linearGradient>

      <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" />
        <stop offset="100%" stop-color="#10B981" />
      </linearGradient>

      <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
      </linearGradient>

      <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="7" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
      </radialGradient>
    </defs>

    <!-- Outer Ambient Glow -->
    <circle cx="130" cy="130" r="95" fill="url(#coreLight)" />

    <!-- Quantum Orbit 1 -->
    <ellipse cx="130" cy="130" rx="108" ry="42" stroke="url(#neonCyanPurple)" stroke-width="2.5" stroke-dasharray="6 8" transform="rotate(-28 130 130)" opacity="0.75" />
    <circle cx="220" cy="84" r="5" fill="#00F0FF" filter="url(#neonGlow)" />
    <circle cx="40" cy="176" r="3.5" fill="#8B5CF6" />

    <!-- Quantum Orbit 2 -->
    <ellipse cx="130" cy="130" rx="108" ry="42" stroke="url(#neonCyanPurple)" stroke-width="2.5" stroke-dasharray="6 8" transform="rotate(32 130 130)" opacity="0.55" />
    <circle cx="218" cy="179" r="4.5" fill="#10B981" />
    <circle cx="42" cy="81" r="3.5" fill="#00F0FF" />

    <!-- Vault Outer Bezel / Shield -->
    <polygon points="130,22 215,68 215,165 130,225 45,165 45,68" fill="url(#shieldGrad)" stroke="url(#neonCyanPurple)" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Vault Rivets -->
    <circle cx="130" cy="38" r="3.5" fill="#00F0FF" />
    <circle cx="198" cy="76" r="3.5" fill="#00F0FF" />
    <circle cx="198" cy="158" r="3.5" fill="#8B5CF6" />
    <circle cx="130" cy="208" r="3.5" fill="#8B5CF6" />
    <circle cx="62" cy="158" r="3.5" fill="#00F0FF" />
    <circle cx="62" cy="76" r="3.5" fill="#00F0FF" />

    <!-- Inner Vault Portal Ring (The Body of Q) -->
    <circle cx="130" cy="122" r="48" fill="#090D16" stroke="url(#neonCyanPurple)" stroke-width="8.5" />
    <circle cx="130" cy="122" r="36" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" />

    <!-- Cryptographic Lattice / Keyhole Core -->
    <path d="M123 108 C123 104 126 101 130 101 C134 101 137 104 137 108 C137 111.5 134.8 114.5 132 115.5 L133 128 C133 129.5 131.8 131 130 131 C128.2 131 127 129.5 127 128 L128 115.5 C125.2 114.5 123 111.5 123 108 Z" fill="#00F0FF" filter="url(#neonGlow)" />
    
    <!-- Dynamic "Q" Laser Tail -->
    <path d="M148 142 L185 182 L172 188 L140 152 Z" fill="url(#tailGrad)" filter="url(#neonGlow)" />
    <circle cx="185" cy="182" r="4.5" fill="#00F0FF" filter="url(#neonGlow)" />
  </svg>

  <div class="brand-text">
    <div class="title"><span>QYU</span>VAULT</div>
  </div>
</div>

</body>
</html>
