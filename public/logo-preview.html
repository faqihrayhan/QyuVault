<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080B11;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .container {
    width: 600px;
    height: 600px;
    background: radial-gradient(circle at 50% 40%, #151D2C 0%, #080B11 75%);
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  /* Cyber subtle grid */
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
  }
  svg {
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 15px 35px rgba(0, 240, 255, 0.25));
  }
  .brand-text {
    margin-top: 18px;
    text-align: center;
    z-index: 2;
  }
  .title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #FFFFFF;
    text-transform: uppercase;
  }
  .title span {
    color: #00F0FF;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
  }
  .subtitle {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #7E8B9F;
    text-transform: uppercase;
    font-family: monospace;
  }
</style>
</head>
<body>

<div class="container" id="logo-card">
  <div class="grid-bg"></div>

  <!-- SVG Icon -->
  <svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradients -->
      <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" />
        <stop offset="50%" stop-color="#3B82F6" />
        <stop offset="100%" stop-color="#8B5CF6" />
      </linearGradient>

      <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
      </linearGradient>

      <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" />
        <stop offset="100%" stop-color="#10B981" />
      </linearGradient>

      <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
      </linearGradient>

      <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <radialGradient id="coreLight" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
      </radialGradient>
    </defs>

    <!-- Outer Ambient Glow -->
    <circle cx="130" cy="130" r="90" fill="url(#coreLight)" />

    <!-- Quantum Orbit 1 (tilted 35 deg) -->
    <ellipse cx="130" cy="130" rx="105" ry="42" stroke="url(#neonCyanPurple)" stroke-width="2.5" stroke-dasharray="6 8" transform="rotate(-28 130 130)" opacity="0.65" />
    <circle cx="218" cy="85" r="4.5" fill="#00F0FF" filter="url(#neonGlow)" />
    <circle cx="42" cy="175" r="3.5" fill="#8B5CF6" />

    <!-- Quantum Orbit 2 (tilted -35 deg) -->
    <ellipse cx="130" cy="130" rx="105" ry="42" stroke="url(#neonCyanPurple)" stroke-width="2.5" stroke-dasharray="6 8" transform="rotate(32 130 130)" opacity="0.45" />
    <circle cx="215" cy="178" r="4" fill="#10B981" />
    <circle cx="45" cy="82" r="3" fill="#00F0FF" />

    <!-- Vault Outer Bezel / Shield -->
    <polygon points="130,22 215,68 215,165 130,225 45,165 45,68" fill="url(#shieldGrad)" stroke="url(#neonCyanPurple)" stroke-width="3" stroke-linejoin="round" />

    <!-- Vault Dial Teeth / Bolt Rivets -->
    <circle cx="130" cy="38" r="3" fill="#00F0FF" />
    <circle cx="198" cy="76" r="3" fill="#00F0FF" />
    <circle cx="198" cy="158" r="3" fill="#8B5CF6" />
    <circle cx="130" cy="208" r="3" fill="#8B5CF6" />
    <circle cx="62" cy="158" r="3" fill="#00F0FF" />
    <circle cx="62" cy="76" r="3" fill="#00F0FF" />

    <!-- Inner Vault Portal Ring (The Body of Q) -->
    <circle cx="130" cy="122" r="48" fill="#090D16" stroke="url(#neonCyanPurple)" stroke-width="8" />
    <circle cx="130" cy="122" r="36" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />

    <!-- Cryptographic Lattice / Keyhole Core -->
    <!-- Stylized Post-Quantum Lock -->
    <path d="M123 108 C123 104 126 101 130 101 C134 101 137 104 137 108 C137 111.5 134.8 114.5 132 115.5 L133 128 C133 129.5 131.8 131 130 131 C128.2 131 127 129.5 127 128 L128 115.5 C125.2 114.5 123 111.5 123 108 Z" fill="#00F0FF" filter="url(#neonGlow)" />
    
    <!-- Dynamic "Q" Laser Tail (Cutting down-right with energy) -->
    <path d="M148 142 L185 182 L172 188 L140 152 Z" fill="url(#tailGrad)" filter="url(#neonGlow)" />
    <circle cx="185" cy="182" r="4" fill="#00F0FF" filter="url(#neonGlow)" />
  </svg>

  <div class="brand-text">
    <div class="title"><span>QYU</span>VAULT</div>
    <div class="subtitle">POST-QUANTUM USDC VAULT • ARC</div>
  </div>
</div>

</body>
</html>
